<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/index.css" />

    <script src="./App.js" type="module"></script>
  </head>
  <body>
    <template id="logo-template">
      <div class="logo">
        <h3 class="logo-text">*Björns*</h3>
        <h3 class="logo-text">Otroliga</h3>
        <h3 class="logo-text">*CASINO*</h3>
      </div>
    </template>
    <div class="game-titlebar">
      <span class="game-title"
        ><span class="blink">*</span>Björns<span class="blink">*</span> Otroliga
        <span class="blink">*</span>Casino<span class="blink">*</span></span
      >
      <span class="game-subtitle"
        >Du kan vinna pengar på 'Björns otroliga casino'</span
      >
    </div>
    <div id="login-div" class="view">
      <div id="login-container" class="board">
        <form class="input-div">
          <span>
            <p>Username</p>
            <input id="username-input" type="text" />
            <button id="login-btn" type="button" class="btn">Login</button>
          </span>
          <span>
            <p>Password</p>
            <input id="password-input" type="password" />
            <button id="create-new-user-btn" type="button" class="btn">
              Create new user
            </button>
          </span>
        </form>
      </div>
    </div>
    <div id="create-new-user-div" class="view">
      <div id="create-new-user-container" class="board">
        <form class="input-div">
          <span>
            <p>Username</p>
            <input id="create-username-input" type="text" />
            <button id="create-btn" type="button" class="btn">
              Create
            </button></span
          >
          <span>
            <p>Password</p>
            <input id="create-password-input" type="password" />
            <button id="cancel-btn" type="button" class="btn">
              Cancel
            </button></span
          >
        </form>
      </div>
    </div>
    <div id="infoScreen" class="info-overlay hidden">
      <div class="info-box">
        <p id="infoMessage"></p>
        <button id="infoDismissButton" class="btn dismiss">[ OK ]</button>
      </div>
    </div>
    <div id="decisionScreen" class="info-overlay hidden">
      <div class="info-box">
        <p id="decisionMessage"></p>
        <span>
          <button id="decisionYesButton" class="btn">[ YES ]</button>
          <button id="decisionNoButton" class="btn">[ NO ]</button>
        </span>
      </div>
    </div>
    <div id="blackjack-div" class="view">
      <div class="game-table">
        <div class="player-zone">
          <div class="profile-block">
            <img
              src="./data/gifs/Air_Guitar.gif"
              class="profile-gif"
              alt="Dealer"
            />
            <span class="player-label">DEALER</span>
          </div>
          <div class="cards-panel">
            <div id="dealerCards" class="cards-area"></div>
          </div>
          <div class="score-row">
            SCORE: <span id="dealerScore" class="score-value">--</span>
          </div>
        </div>

        <div class="center-controls">
          <div class="player-label bet-label">BET</div>
          <div class="bet-controls">
            <button id="betDecreaseButton" class="btn bet-btn">[-5]</button>
            <input
              type="number"
              id="betInput"
              class="inputbox"
              value="5"
              min="5"
              max="500"
            />
            <button id="betIncreaseButton" class="btn bet-btn">[+5]</button>
          </div>
          <div class="divider">────────────</div>
          <button id="dealNewHandButton" class="btn">[ NEW HAND ]</button>
          <div class="divider">────────────</div>
          <div class="player-label balance-label">BALANCE</div>
          <div id="balanceDisplay" class="balance-display"></div>
          <button id="depositMoneyButton" class="btn">[ DEPOSIT ]</button>
          <div class="divider">────────────</div>
          <button id="logout-button" class="btn">Logout</button>
        </div>

        <div class="player-zone player-zone--self">
          <div class="profile-block">
            <img
              src="./data/gifs/Player_Icon.gif"
              class="profile-gif"
              alt="Player"
            />
            <span class="player-label">PLAYER</span>
          </div>
          <div class="cards-panel">
            <div id="playerHands" class="cards-area"></div>
          </div>
          <div class="score-row">
            SCORE: <span id="playerScore" class="score-value">--</span>
          </div>
          <div class="player-action-buttons">
            <button id="playerHitCardButton" class="btn">[ HIT ]</button>
            <button id="playerStayButton" class="btn">[ STAY ]</button>
          </div>
        </div>
      </div>
    </div>
    <div id="depositDiv" class="view">
      <div class="deposit-table">
        <div class="profile-block">
          <img
            src="./data/gifs/Dance_Single.gif"
            class="profile-gif deposit-gif"
            alt="Deposit"
          />
          <span class="player-label">DEPOSIT</span>
        </div>
        <div class="divider">────────────</div>
        <div class="player-label balance-label">AMOUNT</div>
        <div class="deposit-calculator">
          <input
            type="text"
            id="depositInput"
            class="deposit-input"
            placeholder="0"
            readonly
          />
          <div class="calc-grid">
            <button class="btn calc-btn calc-num" data-key="7">7</button>
            <button class="btn calc-btn calc-num" data-key="8">8</button>
            <button class="btn calc-btn calc-num" data-key="9">9</button>
            <button class="btn calc-btn calc-op" data-key="C">C</button>
            <button class="btn calc-btn calc-num" data-key="4">4</button>
            <button class="btn calc-btn calc-num" data-key="5">5</button>
            <button class="btn calc-btn calc-num" data-key="6">6</button>
            <button class="btn calc-btn calc-op" data-key="/">/</button>
            <button class="btn calc-btn calc-num" data-key="1">1</button>
            <button class="btn calc-btn calc-num" data-key="2">2</button>
            <button class="btn calc-btn calc-num" data-key="3">3</button>
            <button class="btn calc-btn calc-op" data-key="*">*</button>
            <button class="btn calc-btn calc-num" data-key="0">0</button>
            <button class="btn calc-btn calc-op" data-key="+">+</button>
            <button class="btn calc-btn calc-op" data-key="-">-</button>
            <button class="btn calc-btn calc-eq" data-key="=">=</button>
          </div>
        </div>
        <div class="divider">────────────</div>
        <div class="deposit-action-buttons">
          <button id="confirmDepositButton" class="btn">[ DEPOSIT ]</button>
          <button id="backFromDepositButton" class="btn">[ BACK ]</button>
        </div>
      </div>
    </div>
  </body>
</html>
